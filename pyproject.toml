[project]
name = "llm-learning"
version = "0.1.0"
description = "LLM 学习项目"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate",
    "datasets",
    "evaluate",
    "matplotlib",
    "numpy",
    "peft",
    "rouge-score",
    "tokenizers",
    "torch",
    "tqdm",
    "transformers",
    "trl",
]

[tool.ruff.lint]
extend-select = [
    "UP",  # pyupgrade
    "I",   # isort
]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.411",
    "ruff>=0.16.0",
]
